<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pelichero | Portfolio</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --accent2: #3fb950;
      --text: #c9d1d9;
      --muted: #8b949e;
      --heading: #f0f6fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ─── Layout ─────────────────────────────────────── */
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* ─── Hero ───────────────────────────────────────── */
    .hero {
      padding: 5rem 0 3rem;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--border);
      margin-bottom: 1.25rem;
    }

    .hero h1 {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--heading);
      letter-spacing: -0.5px;
    }

    .hero .handle {
      font-size: 1.1rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .hero .tagline {
      margin-top: 1rem;
      font-size: 1rem;
      color: var(--text);
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-links {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    .btn:hover {
      opacity: 0.85;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #0d1117;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ─── Sections ───────────────────────────────────── */
    section {
      padding: 2.5rem 0;
      border-top: 1px solid var(--border);
    }

    section h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--heading);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* ─── Skills ─────────────────────────────────────── */
    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .skill-tag {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.3rem 0.85rem;
      font-size: 0.82rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .skill-tag .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ─── Project cards ──────────────────────────────── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--muted);
      flex: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .lang-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    /* ─── Timeline ───────────────────────────────────── */
    .timeline {
      list-style: none;
      position: relative;
      padding-left: 1.5rem;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: var(--border);
    }

    .timeline li {
      position: relative;
      padding-bottom: 1.5rem;
    }

    .timeline li:last-child {
      padding-bottom: 0;
    }

    .timeline li::before {
      content: "";
      position: absolute;
      left: -1.28rem;
      top: 6px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg);
    }

    .timeline-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--heading);
    }

    .timeline-sub {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* ─── Contact ────────────────────────────────────── */
    .contact-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .contact-list li {
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* ─── Footer ─────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 0;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ─── Responsive ─────────────────────────────────── */
    @media (max-width: 540px) {
      .hero h1 { font-size: 1.75rem; }
      .projects-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ── Hero ───────────────────────────────────────── -->

    <div class="container">

    </div>
  </header>


</body>
</html>
